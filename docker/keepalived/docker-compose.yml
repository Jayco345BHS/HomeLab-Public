services:
  keepalived:
    image: shawly/keepalived:2.3.2
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Toronto}
      KEEPALIVED_VIRTUAL_IP: ${KEEPALIVED_VIRTUAL_IP:-172.17.8.150}
      KEEPALIVED_VIRTUAL_MASK: ${KEEPALIVED_VIRTUAL_MASK:-24}
      KEEPALIVED_CHECK_IP: ${KEEPALIVED_CHECK_IP:-any}
      KEEPALIVED_CHECK_PORT: ${KEEPALIVED_CHECK_PORT:-80}
      KEEPALIVED_VRID: ${KEEPALIVED_VRID:-150}
      KEEPALIVED_INTERFACE: ${KEEPALIVED_INTERFACE:-eth0}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
