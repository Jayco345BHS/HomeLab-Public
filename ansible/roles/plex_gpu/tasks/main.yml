---
- name: Determine NVIDIA repo settings
  ansible.builtin.set_fact:
    plex_gpu_arch: "{{ nvidia_repo_arch_map[ansible_facts['architecture']] | default(nvidia_repo_arch_map.default) }}"
    plex_gpu_distribution: "{{ nvidia_distro_map[(ansible_facts['distribution_release'] | lower)] | default(nvidia_distro_map.default) }}"

- name: Install build dependencies for NVIDIA drivers
  ansible.builtin.apt:
    name:
      - build-essential
      - "linux-headers-{{ ansible_facts['kernel'] }}"
    state: present
    update_cache: true

- name: Install NVIDIA driver packages
  ansible.builtin.apt:
    name: "{{ nvidia_driver_packages }}"
    state: present
  notify: Reboot for NVIDIA driver

- name: Ensure NVIDIA keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Download NVIDIA container toolkit GPG key (ASCII)
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    mode: "0644"
    force: true

- name: Convert NVIDIA GPG key to keyring
  ansible.builtin.command: >-
    gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    /usr/share/keyrings/nvidia-container-toolkit-keyring.asc

- name: Remove any stale NVIDIA libnvidia-container apt sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/libnvidia-container.list
    - /etc/apt/sources.list.d/nvidia-container.list

- name: Write NVIDIA container toolkit apt sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg arch={{ plex_gpu_arch }}] https://nvidia.github.io/libnvidia-container/stable/deb/{{ plex_gpu_arch }} /

- name: Install NVIDIA container toolkit packages
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
    state: present
    update_cache: true
  notify: Restart Docker

- name: Configure Docker to use the NVIDIA runtime by default
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker --set-as-default
  args:
    creates: /etc/docker/.nvidia-ctk-configured
  register: nvidia_ctk_runtime
  notify: Restart Docker

- name: Mark NVIDIA runtime configuration
  ansible.builtin.file:
    path: /etc/docker/.nvidia-ctk-configured
    state: touch
  when: nvidia_ctk_runtime is changed

- name: Apply pending NVIDIA and Docker handlers before validation
  meta: flush_handlers

- name: Attempt to load NVIDIA kernel module
  ansible.builtin.command: modprobe nvidia
  register: plex_gpu_modprobe
  changed_when: false
  failed_when: false

- name: Attempt to load NVIDIA UVM kernel module
  ansible.builtin.command: modprobe nvidia_uvm
  register: plex_gpu_modprobe_uvm
  changed_when: false
  failed_when: false
  when: plex_gpu_modprobe.rc == 0

- name: Detect Secure Boot state when NVIDIA module load fails
  ansible.builtin.command: mokutil --sb-state
  register: plex_gpu_secure_boot_state
  changed_when: false
  failed_when: false
  when: plex_gpu_modprobe.rc != 0

- name: Validate NVIDIA driver is operational
  ansible.builtin.command: nvidia-smi
  register: plex_gpu_nvidia_smi
  changed_when: false
  failed_when: false

- name: Capture GPU diagnostics when nvidia-smi fails
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== lspci (nvidia) ==="
    lspci -nn | grep -i nvidia || true
    echo
    echo "=== lspci -k (nvidia) ==="
    lspci -nnk | grep -A3 -Ei 'vga|3d|nvidia' || true
    echo
    echo "=== lsmod (nvidia) ==="
    lsmod | grep -i nvidia || true
    echo
    echo "=== dkms status (nvidia) ==="
    dkms status | grep -i nvidia || true
    echo
    echo "=== dmesg (nvidia/nvrm tail) ==="
    dmesg | grep -Ei 'nvidia|nvrm' | tail -n 80 || true
  args:
    executable: /bin/bash
  register: plex_gpu_diagnostics
  changed_when: false
  when: plex_gpu_nvidia_smi.rc != 0

- name: Fail when NVIDIA driver is not usable after provisioning
  ansible.builtin.fail:
    msg: |
      NVIDIA validation failed after provisioning on host {{ inventory_hostname }}.
      modprobe nvidia rc={{ plex_gpu_modprobe.rc | default('n/a') }}
      modprobe nvidia stderr={{ plex_gpu_modprobe.stderr | default('') }}
      modprobe nvidia_uvm rc={{ plex_gpu_modprobe_uvm.rc | default('n/a') }}
      modprobe nvidia_uvm stderr={{ plex_gpu_modprobe_uvm.stderr | default('') }}
        secure boot state={{ plex_gpu_secure_boot_state.stdout | default('unknown') }}
      nvidia-smi rc={{ plex_gpu_nvidia_smi.rc }}
      nvidia-smi stdout={{ plex_gpu_nvidia_smi.stdout | default('') }}
      nvidia-smi stderr={{ plex_gpu_nvidia_smi.stderr | default('') }}

      Diagnostic snapshot:
      {{ plex_gpu_diagnostics.stdout | default('no diagnostics captured') }}

        Suggested remediation:
        - If modprobe reports "Key was rejected by service", disable Secure Boot for the VM firmware or enroll/sign the NVIDIA DKMS module key (MOK).
        - On Proxmox with OVMF, verify VM Secure Boot is disabled for this guest when using unsigned DKMS modules.
  when: plex_gpu_nvidia_smi.rc != 0
