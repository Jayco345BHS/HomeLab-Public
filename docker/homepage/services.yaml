- Infrastructure:
  - Proxmox:
      href: http://192.168.1.10:8006
      description: Hypervisor management
      icon: proxmox.png
      ping: 192.168.1.10
      widget:
        type: proxmox
        url: https://192.168.1.10:8006
        username: api@pam!homepage-token
        password: CHANGE_ME_PROXMOX_TOKEN_SECRET
        node: proxmox-node # optional

  - TrueNAS:
      href: http://192.168.1.15
      description: Storage and SMB shares
      icon: truenas.png
