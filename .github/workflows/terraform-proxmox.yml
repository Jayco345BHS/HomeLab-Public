name: Terraform Proxmox VMs

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose plan to review or apply to create/update VMs"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      target_scope:
        description: "Choose plex-only (safe default) or all-vms"
        required: true
        default: plex-1
        type: choice
        options:
          - plex-1
          - all-vms

jobs:
  terraform:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/proxmox
    env:
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_pm_api_url: "https://alex-server:8006/api2/json"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.target_scope }}" = "plex-1" ]; then
            terraform plan -target='proxmox_virtual_environment_vm.vm["plex-1"]' -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Import plex-1 when running plex-only apply
        if: ${{ github.event.inputs.run_mode == 'apply' && github.event.inputs.target_scope == 'plex-1' }}
        env:
          TF_VAR_pm_api_url: "https://alex-server:8006/api2/json"
        run: |
          set -euo pipefail
          if terraform state show 'proxmox_virtual_environment_vm.vm["plex-1"]' >/dev/null 2>&1; then
            echo "plex-1 is already present in Terraform state."
          else
            echo "Importing existing plex-1 VM into ephemeral CI state..."
            terraform import 'proxmox_virtual_environment_vm.vm["plex-1"]' "Alex-Server/103"
          fi

      - name: Re-plan plex-1 after import
        if: ${{ github.event.inputs.run_mode == 'apply' && github.event.inputs.target_scope == 'plex-1' }}
        env:
          TF_VAR_pm_api_url: "https://alex-server:8006/api2/json"
        run: terraform plan -target='proxmox_virtual_environment_vm.vm["plex-1"]' -out=tfplan

      - name: Guard apply when state is empty
        if: ${{ github.event.inputs.run_mode == 'apply' && github.event.inputs.target_scope == 'all-vms' }}
        run: |
          set -euo pipefail
          state_list_file=$(mktemp)
          terraform state list >"$state_list_file" 2>/dev/null || true
          managed_count=$(grep -Ec '^[[:alnum:]_]+\.' "$state_list_file" || true)
          echo "Detected Terraform-managed resources in state: $managed_count"
          if [ "$managed_count" -eq 0 ]; then
            echo "::error::Terraform state is empty in this GitHub runner."
            echo "::error::Apply is blocked to avoid recreating existing Proxmox VMs."
            echo "::error::Use a remote backend or import existing resources into state before applying from CI."
            exit 1
          fi

      - name: Terraform apply
        if: ${{ github.event.inputs.run_mode == 'apply' }}
        env:
          TF_VAR_pm_api_url: "https://alex-server:8006/api2/json"
        run: terraform apply -auto-approve tfplan
