---
- name: Determine NVIDIA repo settings
  ansible.builtin.set_fact:
    plex_gpu_arch: "{{ nvidia_repo_arch_map[ansible_facts['architecture']] | default(nvidia_repo_arch_map.default) }}"
    plex_gpu_distribution: "{{ nvidia_distro_map[(ansible_facts['distribution_release'] | lower)] | default(nvidia_distro_map.default) }}"

- name: Install build dependencies for NVIDIA drivers
  ansible.builtin.apt:
    name:
      - build-essential
      - "linux-headers-{{ ansible_facts['kernel'] }}"
    state: present
    update_cache: true

- name: Install NVIDIA driver packages
  ansible.builtin.apt:
    name: "{{ nvidia_driver_packages }}"
    state: present
  notify: Reboot for NVIDIA driver

- name: Ensure NVIDIA keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Download NVIDIA container toolkit GPG key (ASCII)
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    mode: "0644"
    force: true

- name: Convert NVIDIA GPG key to keyring
  ansible.builtin.command: >-
    gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    /usr/share/keyrings/nvidia-container-toolkit-keyring.asc

- name: Remove any stale NVIDIA libnvidia-container apt sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/libnvidia-container.list
    - /etc/apt/sources.list.d/nvidia-container.list

- name: Write NVIDIA container toolkit apt sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg arch={{ plex_gpu_arch }}] https://nvidia.github.io/libnvidia-container/stable/deb/{{ plex_gpu_arch }} /

- name: Install NVIDIA container toolkit packages
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
    state: present
    update_cache: true
  notify: Restart Docker

- name: Configure Docker to use the NVIDIA runtime by default
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker --set-as-default
  args:
    creates: /etc/docker/.nvidia-ctk-configured
  register: nvidia_ctk_runtime
  notify: Restart Docker

- name: Mark NVIDIA runtime configuration
  ansible.builtin.file:
    path: /etc/docker/.nvidia-ctk-configured
    state: touch
  when: nvidia_ctk_runtime is changed
