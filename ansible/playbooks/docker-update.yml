---
- name: Deploy Docker stacks
  hosts: docker_hosts
  become: true
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    stack_src_root: "{{ repo_root }}/docker"
    stack_base_path: /opt/docker
    compose_no_space_error_regex: '(?i)no space left on device'
    gpu_required_stacks:
      - plex
      - immich
    docker_stacks:
      dns-1: []
      docker-1:
        - arrstack
        - yubal
        - homepage
        - termix
      plex-1:
        - plex
        - immich
      gameserver-1: []

  tasks:
    - name: Ensure Docker base directory exists
      file:
        path: "{{ stack_base_path }}"
        state: directory
        mode: "0755"

    - name: Ensure stack directory exists on host
      file:
        path: "{{ stack_base_path }}/{{ stack_name }}"
        state: directory
        mode: "0755"
      loop: "{{ docker_stacks[inventory_hostname] | default([]) }}"
      loop_control:
        loop_var: stack_name

    - name: Copy stack files to host
      copy:
        src: "{{ stack_src_root }}/{{ stack_name }}/"
        dest: "{{ stack_base_path }}/{{ stack_name }}/"
        owner: root
        group: root
        mode: preserve
      loop: "{{ docker_stacks[inventory_hostname] | default([]) }}"
      loop_control:
        loop_var: stack_name

    - name: Ensure Seerr config directory is writable by UID 1000
      file:
        path: "{{ stack_base_path }}/arrstack/seerr/config"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      when: "'arrstack' in (docker_stacks[inventory_hostname] | default([]))"

    - name: Identify GPU-required stacks on host
      set_fact:
        host_gpu_required_stacks: >-
          {{
            (docker_stacks[inventory_hostname] | default([]))
            | intersect(gpu_required_stacks)
            | list
          }}

    - name: Collect docker runtime info for GPU-required hosts
      command:
        cmd: docker info
      register: docker_info_result
      changed_when: false
      failed_when: false
      when: (host_gpu_required_stacks | default([]) | length) > 0

    - name: Fail when NVIDIA docker runtime is unavailable
      fail:
        msg: >-
          Host {{ inventory_hostname }} runs GPU-required stacks {{ host_gpu_required_stacks | join(', ') }},
          but Docker runtime "nvidia" is not available. Ensure NVIDIA Container Toolkit is installed and Docker is configured with the nvidia runtime.
      when:
        - (host_gpu_required_stacks | default([]) | length) > 0
        - docker_info_result.rc != 0 or ((docker_info_result.stdout | default('')) is not search('Runtimes:.*nvidia'))

    - name: Check NVIDIA driver health for GPU-required hosts
      command:
        cmd: nvidia-smi
      register: nvidia_smi_result
      changed_when: false
      failed_when: false
      when: (host_gpu_required_stacks | default([]) | length) > 0

    - name: Fail when NVIDIA driver is unhealthy
      fail:
        msg: >-
          Host {{ inventory_hostname }} failed nvidia-smi check while running GPU-required stacks {{ host_gpu_required_stacks | join(', ') }}.
          rc={{ nvidia_smi_result.rc }} stderr={{ nvidia_smi_result.stderr | default('') }}
      when:
        - (host_gpu_required_stacks | default([]) | length) > 0
        - nvidia_smi_result.rc != 0

    - name: Pull and recreate stack (first attempt)
      command:
        cmd: docker compose up -d --pull always --remove-orphans
        chdir: "{{ stack_base_path }}/{{ stack_name }}"
      loop: "{{ docker_stacks[inventory_hostname] | default([]) }}"
      loop_control:
        loop_var: stack_name
      register: compose_first_attempt
      failed_when: false

    - name: Identify stacks that failed from no-space condition
      set_fact:
        compose_no_space_stacks: >-
          {{
            compose_first_attempt.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | selectattr('stderr', 'defined')
            | selectattr('stderr', 'search', compose_no_space_error_regex)
            | map(attribute='stack_name')
            | list
          }}

    - name: Fail immediately on non-space compose errors
      fail:
        msg: >-
          Docker compose failed for stack {{ item.stack_name }} on host {{ inventory_hostname }}
          with rc={{ item.rc }}. stderr={{ item.stderr | default('') }}
      loop: >-
        {{
          compose_first_attempt.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'ne', 0)
          | rejectattr('stderr', 'defined')
          | list
          +
          (
            compose_first_attempt.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | selectattr('stderr', 'defined')
            | rejectattr('stderr', 'search', compose_no_space_error_regex)
            | list
          )
        }}
      loop_control:
        label: "{{ item.stack_name | default('unknown') }}"

    - name: Prune unused Docker images when space errors are detected
      command:
        cmd: docker image prune -af
      when: (compose_no_space_stacks | default([]) | length) > 0

    - name: Retry pull and recreate for stacks that failed from no space
      command:
        cmd: docker compose up -d --pull always --remove-orphans
        chdir: "{{ stack_base_path }}/{{ stack_name }}"
      loop: "{{ compose_no_space_stacks | default([]) }}"
      loop_control:
        loop_var: stack_name
      register: compose_retry_attempt
      failed_when: false
      when: (compose_no_space_stacks | default([]) | length) > 0

    - name: Identify stacks that still fail from no-space after retry
      set_fact:
        compose_retry_no_space_stacks: >-
          {{
            compose_retry_attempt.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | selectattr('stderr', 'defined')
            | selectattr('stderr', 'search', 'no space left on device')
            | map(attribute='stack_name')
            | list
          }}
      when: (compose_no_space_stacks | default([]) | length) > 0

    - name: Fail when retry has non-space errors
      fail:
        msg: >-
          Docker compose retry failed for stack {{ item.stack_name }} on host {{ inventory_hostname }}
          with rc={{ item.rc }}. stderr={{ item.stderr | default('') }}
      loop: >-
        {{
          compose_retry_attempt.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'ne', 0)
          | rejectattr('stderr', 'defined')
          | list
          +
          (
            compose_retry_attempt.results
            | default([])
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | selectattr('stderr', 'defined')
            | rejectattr('stderr', 'search', compose_no_space_error_regex)
            | list
          )
        }}
      loop_control:
        label: "{{ item.stack_name | default('unknown') }}"
      when: (compose_no_space_stacks | default([]) | length) > 0

    - name: Ensure existing containers stay up when pull cannot complete due to space
      command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ stack_base_path }}/{{ stack_name }}"
      loop: "{{ compose_retry_no_space_stacks | default([]) }}"
      loop_control:
        loop_var: stack_name
      register: compose_no_pull_attempt
      failed_when: false
      when: (compose_retry_no_space_stacks | default([]) | length) > 0

    - name: Fail when no-pull fallback fails
      fail:
        msg: >-
          Docker compose no-pull fallback failed for stack {{ item.stack_name }} on host {{ inventory_hostname }}
          with rc={{ item.rc }}. stderr={{ item.stderr | default('') }}
      loop: >-
        {{
          compose_no_pull_attempt.results
          | default([])
          | selectattr('rc', 'defined')
          | selectattr('rc', 'ne', 0)
          | list
        }}
      loop_control:
        label: "{{ item.stack_name | default('unknown') }}"
      when: (compose_retry_no_space_stacks | default([]) | length) > 0

    - name: Warn when stack update was skipped due to persistent no-space
      debug:
        msg: >-
          Stack {{ stack_name }} on host {{ inventory_hostname }} could not pull fresh images due to low Docker storage.
          Existing containers were reconciled without pulling new images.
      loop: "{{ compose_retry_no_space_stacks | default([]) }}"
      loop_control:
        loop_var: stack_name
      when: (compose_retry_no_space_stacks | default([]) | length) > 0
