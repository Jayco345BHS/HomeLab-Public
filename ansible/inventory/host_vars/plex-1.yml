---
# Override NVIDIA driver settings for Plex
nvidia_driver_version: 565
nvidia_driver_packages:
  - nvidia-headless-565-server
  - nvidia-utils-565-server
  - libnvidia-encode-565-server
plex_gpu_reboot_after_driver: true

# SMB share mounts for plex-1
# media: Plex library storage
smb_mounts:
  - name: media
    path: /mnt/media
    src: //192.168.1.15/media
    opts: "username=CHANGE_ME_SMB_USER,password=CHANGE_ME_PASSWORD,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
